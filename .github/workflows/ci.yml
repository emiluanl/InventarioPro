name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # =============================================================================
  # Backend: install, lint, type-check, test
  # =============================================================================
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
        run: npx prisma generate

      # Estricto: sin --fix, falla ante violaciones (npm run lint:fix para
      # auto-corregir en local). src/generated/ está excluido via .eslintignore.
      # El name va entre comillas: "estricto:" con dos puntos+espacio dentro del
      # scalar lo hace ambiguo para parsers YAML estrictos.
      - name: "Lint (estricto: falla ante violaciones)"
        run: npm run lint --if-present

      - name: Type-check
        run: npx tsc --noEmit

      - name: Test
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
          REDIS_HOST: localhost
          JWT_ACCESS_SECRET: test-access-secret-for-ci-only-32chars
          NODE_ENV: test
        run: npm run test:cov

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage/
          retention-days: 7

  # =============================================================================
  # Backend contra SQLite: el mismo código que corre con Postgres, compilado y
  # verificado contra el proveedor SQLite (modo local sin Docker de la app).
  #   - prisma generate con el schema sqlite (mismo paso que scripts/start.sh).
  #   - build del backend con ese cliente.
  #   - migraciones SQLite aplicadas + smoke: node dist/main.js → /api/health.
  #   - suite de tests completa en modo sqlite.
  # =============================================================================
  backend-sqlite:
    name: Backend (SQLite — compile + smoke + tests)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client (SQLite)
        run: DB_PROVIDER=sqlite npx prisma generate

      - name: Build (cliente SQLite)
        run: npm run build

      - name: Apply SQLite migrations
        run: DB_PROVIDER=sqlite DATABASE_URL=file:./prisma/ci-sqlite.db npx prisma migrate deploy

      - name: Smoke — boot dist y /api/health
        env:
          DB_PROVIDER: sqlite
          DATABASE_URL: file:./prisma/ci-sqlite.db
          PORT: '3110'
          JWT_ACCESS_SECRET: ci-sqlite-access-secret-32chars-min
          JWT_REFRESH_SECRET: ci-sqlite-refresh-secret-32chars-min
          SMTP_HOST: ''
          REDIS_HOST: ''
          NODE_ENV: test
        run: |
          node dist/main.js > /tmp/backend-sqlite.log 2>&1 &
          PID=$!
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:3110/api/health >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3110/api/health || { cat /tmp/backend-sqlite.log; exit 1; }
          kill $PID || true

      - name: Test (SQLite)
        env:
          DB_PROVIDER: sqlite
          DATABASE_URL: file:./prisma/ci-sqlite.db
          JWT_ACCESS_SECRET: ci-sqlite-access-secret-32chars-min
          JWT_REFRESH_SECRET: ci-sqlite-refresh-secret-32chars-min
          NODE_ENV: test
        run: npm test -- --runInBand

  # =============================================================================
  # Frontend: install, lint, type-check, build
  # =============================================================================
  frontend:
    name: Frontend (lint + type-check + build)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Test (Vitest)
        run: npm test

      # El build genera los assets del logo (npm run build incluye
      # generate:logo-assets); la validación falla si faltara cualquiera de
      # los PNG/SVG/favicon requeridos (los PNG no viven en git).
      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
        run: npm run build

      - name: Validate logo assets
        run: npm run validate:logo-assets

  # =============================================================================
  # Frontend standalone: verifica que el build autónomo (output: standalone, el
  # mismo que usa el Dockerfile de escritorio) arranca y sirve la app sin el
  # dev server — smoke real de .next/standalone/server.js.
  # =============================================================================
  frontend-standalone:
    name: Frontend (standalone smoke)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (standalone)
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001/api
        run: npm run build

      - name: Smoke — servidor standalone responde
        run: |
          # El server standalone puede quedar en .next/standalone/server.js
          # (root de tracing = la app) o bajo .next/standalone/frontend/server.js
          # (root de tracing = raíz del monorepo, como en CI). Se resuelve
          # dinámicamente y se copia .next/static junto al server, igual que
          # el Dockerfile (COPY .next/static ./.next/static).
          STANDALONE=".next/standalone"
          if [ -f "$STANDALONE/server.js" ]; then
            SERVER="$STANDALONE/server.js"
            STATIC_DEST="$STANDALONE/.next/static"
          elif [ -f "$STANDALONE/frontend/server.js" ]; then
            SERVER="$STANDALONE/frontend/server.js"
            STATIC_DEST="$STANDALONE/frontend/.next/static"
          else
            echo "No se encontró server.js bajo $STANDALONE" >&2
            find .next/standalone -maxdepth 3 -name server.js 2>/dev/null || true
            exit 1
          fi
          cp -r .next/static "$STATIC_DEST"
          PORT=3111 HOSTNAME=127.0.0.1 node "$SERVER" > /tmp/next-standalone.log 2>&1 &
          PID=$!
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3111/ >/dev/null 2>&1; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3111/ | grep -qi '<html' || { cat /tmp/next-standalone.log; exit 1; }
          kill $PID || true

  # =============================================================================
  # Load test (INFORMATIVO — no bloquea el workflow): mide la latencia real del
  # backend COMPILADO contra una BD SQLite TEMPORAL creada con las migraciones
  # actuales (sin depender de dev.db, sin Postgres externo, sin API key).
  #   · continue-on-error: true → si falla, el job queda fallido pero el resto
  #     del workflow continúa y nadie depende de él.
  #   · El paso de upload usa if: always() → el reporte y el log se suben SIEMPRE
  #     (también cuando el job falla), para que la causa quede visible.
  #   · El exit code NO se oculta: el script termina != 0 si hubo fallos HTTP.
  # =============================================================================
  load-test:
    name: Load test (informativo, no bloquea)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Crear BD SQLite temporal (migraciones actuales, sin dev.db)
        working-directory: backend
        run: DB_PROVIDER=sqlite DATABASE_URL=file:./prisma/ci-load.db npx prisma migrate deploy

      - name: Ejecutar load test (compila + arranca el backend + mide)
        env:
          LOAD_TEST_SOURCE_DB: ${{ github.workspace }}/backend/prisma/ci-load.db
          LOAD_TEST_REPORT: load-test-results.json
          LOAD_TEST_PORT: '3112'
          LOAD_TEST_ITERS: '60'
          LOAD_TEST_CONCURRENCY: '5'
        run: |
          set -o pipefail
          node scripts/load-test.js \
            --source-db "$LOAD_TEST_SOURCE_DB" \
            --report "$LOAD_TEST_REPORT" \
            --port "$LOAD_TEST_PORT" 2>&1 | tee load-test-run.log

      - name: Subir resultados del load test (siempre, incluso si falla)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: load-test-results
          path: |
            load-test-results.json
            load-test-run.log
          retention-days: 7

  # =============================================================================
  # E2E: flujos de navegador con Playwright (registro, verificación, login, alta)
  # =============================================================================
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install e2e dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run e2e tests
        env:
          E2E_DATABASE_URL: postgresql://test:test@localhost:5432/test?schema=public
        run: npm run test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # =============================================================================
  # Seguridad: audit de dependencias (npm audit) en los 3 paquetes.
  # =============================================================================
  audit:
    name: Security (npm audit)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        package: [backend, frontend]

    defaults:
      run:
        working-directory: ${{ matrix.package }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.package }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Falla ante vulnerabilidades de severidad media o superior. Las de bajo
      # riesgo no bloquean el CI pero se ven en el log. --omit=dev no aplica
      # aquí: queremos auditar también las devDependencies (build tooling).
      - name: Audit dependencies
        run: npm audit --audit-level=moderate

  # =============================================================================
  # Verificador de firmas Authenticode (autocontenido, sin secretos):
  # ejecuta scripts/test-verify-authenticode.ps1, que genera un PE real (.NET
  # vía Add-Type), un certificado autofirmado efímero (en memoria, PFX en TEMP
  # con contraseña aleatoria) y firma la muestra con signtool si está
  # disponible. No usa Azure, Artifact Signing, PFX real ni credenciales.
  # =============================================================================
  verify-authenticode:
    name: Verify Authenticode (PowerShell, self-contained)
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Run verifier tests
        shell: pwsh
        run: |
          .\scripts\test-verify-authenticode.ps1
          if ($LASTEXITCODE -ne 0) { throw "Pruebas del verificador fallidas" }

  # =============================================================================
  # generate-checksums.ps1 (autocontenido, sin secretos): hashes esperados de
  # archivos ficticios, determinismo, deteccion de cambio y fallo por archivo
  # faltante. El caso de archivo faltante se captura y valida dentro del harness
  # (exit 1 esperado), por lo que no falla el job.
  # =============================================================================
  checksums-tests:
    name: Checksums (PowerShell, self-contained)
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run checksums tests
        shell: pwsh
        run: |
          .\scripts\test-generate-checksums.ps1
          if ($LASTEXITCODE -ne 0) { throw "Pruebas de generate-checksums fallidas" }
