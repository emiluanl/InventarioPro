# =============================================================================
# Desktop — build --dir + smoke test headless + release firmado (NSIS).
#
# desktop-build:      win-unpacked + smoke test real (migraciones → STACK_READY
#                     → flujo funcional). Corre en PR/push (paths) y manual.
# desktop-release:    instalador NSIS FIRMADO desde secretos de GitHub, solo en
#                     workflow_dispatch o tag v*. Reutiliza la firma de
#                     build.sh escribiendo el pfx decodificado en desktop/certs/
#                     (gitignored, checkout efímero).
#
# Secretos necesarios (Settings → Secrets and variables → Actions):
#   WIN_CSC_BASE64       el pfx codificado en base64 (desktop/scripts/
#                        export-secret.ps1 lo genera listo para pegar).
#   WIN_CSC_KEY_PASSWORD la contraseña del pfx.
#
# OJO: el filtro `paths` del trigger `push` también aplica a tags → un tag que
# NO toque esas rutas no dispara el workflow; en ese caso usá workflow_dispatch.
# =============================================================================
name: Desktop

# Crear GitHub Releases requiere contents: write en el GITHUB_TOKEN (el
# default del repo es read-only). Sin esto, el paso "GitHub Release (solo
# tags)" falla con 403 "Resource not accessible by integration".
permissions:
  contents: write

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - 'backend/src/**'
      - 'backend/prisma/**'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/prisma.config.ts'
      - 'frontend/**'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'desktop/**'
      - 'backend/src/**'
      - 'backend/prisma/**'
      - 'backend/package.json'
      - 'backend/package-lock.json'
      - 'backend/prisma.config.ts'
      - 'frontend/**'
      - '.github/workflows/desktop.yml'

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-build:
    name: Build --dir + smoke headless
    # windows-2022 (VS 17): better-sqlite3 no publica prebuild para Node 20
    # (ABI 115) y en windows-latest el VS 18 actual rompe node-gyp 10.1.0
    # ("unknown version undefined"). En windows-2022 compila desde fuente,
    # igual que el build que funcionó (11-08).
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            desktop/package-lock.json

      # build.sh compila backend (nest build + cliente Prisma SQLite) y
      # frontend (Next standalone) desde sus fuentes → necesitan sus deps.
      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      # Ensambla desktop/resources + reconstruye better-sqlite3 para el ABI de
      # Electron + empaqueta dist/win-unpacked (modo --dir, sin instalador).
      - name: Build stack + package (--dir)
        working-directory: desktop
        shell: bash
        run: bash scripts/build.sh

      # Fase A: arranque headless + STACK_READY y salida limpia.
      # Fase B: flujo funcional real (registro → verify → login → producto →
      #         refresh → reuso 401 → familia 401 → web 200).
      - name: Smoke test headless (app empaquetada)
        working-directory: desktop
        shell: bash
        run: bash scripts/smoke-test.sh

      # Artefacto de depuración: descargable desde la página del workflow.
      - name: Upload win-unpacked (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: InventarioPro-win-unpacked
          path: desktop/dist/win-unpacked
          retention-days: 7

  desktop-release:
    name: Installer firmado (NSIS)
    # Mismo motivo que desktop-build: VS 17 + node-gyp 10.1.0 (ver arriba).
    runs-on: windows-2022
    timeout-minutes: 60
    # Solo manual o tag v*: el instalador firmado no se genera en PR/push.
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Install backend deps
        working-directory: backend
        run: npm ci

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install desktop deps
        working-directory: desktop
        run: npm ci

      # El pfx viaja como secreto (base64); build.sh firma leyendo exactamente
      # desktop/certs/inventariopro.pfx + password.txt. desktop/certs/ está
      # gitignored y el checkout de CI es efímero → nunca toca el repo.
      - name: Escribir certificado de firma desde secretos
        shell: pwsh
        run: |
          if (-not $env:WIN_CSC_BASE64) {
            throw "Falta el secreto WIN_CSC_BASE64 (pfx en base64). Ver desktop/scripts/export-secret.ps1"
          }
          $dir = "desktop/certs"
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          [IO.File]::WriteAllBytes("$dir/inventariopro.pfx", [Convert]::FromBase64String($env:WIN_CSC_BASE64))
          [IO.File]::WriteAllText("$dir/password.txt", $env:WIN_CSC_KEY_PASSWORD)
        env:
          WIN_CSC_BASE64: ${{ secrets.WIN_CSC_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}

      - name: Build + instalador firmado (--installer)
        working-directory: desktop
        shell: bash
        run: bash scripts/build.sh --installer

      # Verificación post-firma (modo interno PFX): instalador + binarios
      # internos críticos (InventarioPro.exe, elevate.exe) mediante
      # scripts/verify-authenticode.ps1. En un runner limpio el cert
      # autofirmado NO está en raíces de confianza → Status será UnknownError:
      # -AllowUnknownError lo tolera SOLO si existe firmante Y una identidad
      # esperada coincide (PFX_EXPECTED_SUBJECT o PFX_EXPECTED_THUMBPRINT —
      # variables del workflow, metadatos públicos, no secretos). Si ambas
      # quedan vacías, UnknownError FALLA el job (firmante desconocido no se
      # acepta). El instalador de producción exige firma + timestamp + publisher
      # correcto (vars) en esta misma validación. Si el modo PFX no está activo
      # (sin WIN_CSC_BASE64) este paso se omite sin fallar.
      - name: Verificar firmas (instalador + binarios internos, modo PFX)
        shell: pwsh
        run: |
          if (-not $env:WIN_CSC_BASE64) {
            Write-Host "Modo PFX no activo - se omite la verificacion de firmas."
            exit 0
          }
          $installer = Get-ChildItem "desktop/dist/InventarioPro-Setup-*.exe" |
            Sort-Object LastWriteTime -Descending | Select-Object -First 1
          if (-not $installer) { throw "No se encontro el instalador en desktop/dist/" }
          $targets = @($installer.FullName,
            "desktop/dist/win-unpacked/InventarioPro.exe",
            "desktop/dist/win-unpacked/resources/elevate.exe")
          # Las variables vacias se omiten dentro del verificador (checks
          # opcionales); -AllowUnknownError tolera el UnknownError del cert
          # autofirmado fuera de raices de confianza en runners limpios.
          & "$env:GITHUB_WORKSPACE/scripts/verify-authenticode.ps1" `
            -Path $targets `
            -RequireTimestamp `
            -AllowUnknownError `
            -ExpectedSubject $env:PFX_EXPECTED_SUBJECT `
            -ExpectedThumbprint $env:PFX_EXPECTED_THUMBPRINT
          if ($LASTEXITCODE -ne 0) { throw "Verificacion de firmas fallida (modo PFX)" }
        env:
          WIN_CSC_BASE64: ${{ secrets.WIN_CSC_BASE64 }}
          PFX_EXPECTED_SUBJECT: ${{ vars.PFX_EXPECTED_SUBJECT }}
          PFX_EXPECTED_THUMBPRINT: ${{ vars.PFX_EXPECTED_THUMBPRINT }}

      # Checksums SHA-256 (instalador, blockmap y binarios internos) generados
      # DESPUÉS de firmar con scripts/generate-checksums.ps1 (determinista,
      # orden estable, falla si falta un archivo obligatorio).
      - name: Generar checksums (instalador + binarios)
        shell: pwsh
        run: |
          & "$env:GITHUB_WORKSPACE/scripts/generate-checksums.ps1" `
            -Path "desktop/dist/InventarioPro-Setup-*.exe,desktop/dist/InventarioPro-Setup-*.exe.blockmap,desktop/dist/win-unpacked/InventarioPro.exe,desktop/dist/win-unpacked/resources/elevate.exe" `
            -Output "desktop/dist/checksums.txt" `
            -BaseDir "desktop/dist"
          if ($LASTEXITCODE -ne 0) { throw "Generacion de checksums fallida" }
          Get-Content "desktop/dist/checksums.txt"

      - name: Upload installer + checksums
        uses: actions/upload-artifact@v4
        with:
          name: InventarioPro-Setup
          path: |
            desktop/dist/InventarioPro-Setup-*.exe
            desktop/dist/checksums.txt
          retention-days: 14

      - name: GitHub Release (solo tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            desktop/dist/InventarioPro-Setup-*.exe
            desktop/dist/checksums.txt
          generate_release_notes: true
