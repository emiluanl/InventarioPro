name: Deploy

# =============================================================================
# Deploy automatizado vía SSH (staging y producción).
#
# ⚠️  REQUIERE CONFIGURAR LOS SECRETS EN GitHub (Settings → Secrets → Actions):
#     Entorno STAGING  →  STAGING_HOST / STAGING_USER / STAGING_SSH_KEY
#     Entorno PROD     →  DEPLOY_HOST / DEPLOY_USER / DEPLOY_SSH_KEY
#
# El flujo es el patrón que ya usa DEPLOYMENT.md: pull del código en el
# servidor + `docker compose up -d --build`. El job `migrate` del compose
# aplica las migraciones automáticamente antes de que el backend sirva.
#
# Cómo usarlo:
#   - Manual (recomendado para probar): Actions → Deploy → "Run workflow"
#     → elegir entorno (staging o production).
#   - Automático: al pushear a main se despliega a producción.
#
# ⚠️  Staging no existe todavía: necesitas un servidor de pruebas. Una vez
#     creado, configura sus secrets y podrás probar el workflow completo ahí
#     sin tocar producción.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Entorno al que desplegar'
        required: true
        type: choice
        default: staging
        options:
          - staging
          - production
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy a ${{ inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    # Permite aplicar protection rules por entorno (approved reviewers,
    # required deployments) desde Settings → Environments.
    environment: ${{ inputs.environment || 'production' }}

    steps:
      - uses: actions/checkout@v4

      # ------------------------------------------------------------------
      # Resuelve host/user/key según el entorno elegido. Los secrets se
      # referencian explícitamente (GitHub Actions no permite indexarlos
      # dinámicamente), por eso este paso mapea entorno → secrets.
      # ------------------------------------------------------------------
      - name: Resolver configuración del entorno
        id: cfg
        run: |
          TARGET="${{ inputs.environment || 'production' }}"
          if [ "$TARGET" = "staging" ]; then
            {
              echo "host=${{ secrets.STAGING_HOST }}"
              echo "user=${{ secrets.STAGING_USER }}"
              echo "key=${{ secrets.STAGING_SSH_KEY }}"
              echo "port=${{ secrets.STAGING_PORT || 22 }}"
              echo "dir=${{ vars.STAGING_DIR || '~/InventarioPro-staging' }}"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "host=${{ secrets.DEPLOY_HOST }}"
              echo "user=${{ secrets.DEPLOY_USER }}"
              echo "key=${{ secrets.DEPLOY_SSH_KEY }}"
              echo "port=${{ secrets.DEPLOY_PORT || 22 }}"
              echo "dir=${{ vars.DEPLOY_DIR || '~/InventarioPro' }}"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Validar secrets configurados
        env:
          HOST: ${{ steps.cfg.outputs.host }}
          USER: ${{ steps.cfg.outputs.user }}
          KEY: ${{ steps.cfg.outputs.key }}
        run: |
          if [ -z "$HOST" ] || [ -z "$USER" ] || [ -z "$KEY" ]; then
            echo "::error::Faltan secrets para el entorno elegido. Configúralos en Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Desplegar vía SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ steps.cfg.outputs.host }}
          username: ${{ steps.cfg.outputs.user }}
          key: ${{ steps.cfg.outputs.key }}
          port: ${{ steps.cfg.outputs.port }}
          script: |
            set -e
            cd "${{ steps.cfg.outputs.dir }}"
            git pull --ff-only origin main
            # El env-file es local al servidor (NUNCA subir a git).
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
            # Verificación rápida: healthcheck del backend por la red interna.
            sleep 15
            docker inspect --format '{{.State.Health.Status}}' inventariopro-backend
