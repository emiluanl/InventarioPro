# =============================================================================
# InventarioPro - docker-compose para PRODUCCIÓN
# =============================================================================
# Uso:
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
#
# Requiere un archivo .env.prod con las variables de producción
# (ver DEPLOYMENT.md para la lista completa).
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    container_name: inventariopro-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-inventariopro}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 15s
      timeout: 5s
      retries: 5
    # Sin ports: el backend accede por la red interna de docker.

  redis:
    image: redis:7-alpine
    container_name: inventariopro-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?required}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', '-a', '${REDIS_PASSWORD}', 'ping']
      interval: 15s
      timeout: 5s
      retries: 5

  # Backups automáticos de Postgres (pg_dump + retención). Ver DEPLOYMENT.md §7.
  backup:
    build:
      context: ./backup
    container_name: inventariopro-backup
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-inventariopro}
      # Cron estándar: 03:00 UTC (o TZ) todos los días. Sobrescribible con BACKUP_SCHEDULE.
      BACKUP_SCHEDULE: ${BACKUP_SCHEDULE:-0 3 * * *}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
      BACKUP_DIR: /backups
      TZ: ${TZ:-UTC}
    volumes:
      # Mismo directorio del host que monta postgres: los dumps son accesibles
      # desde la máquina y por el contenedor de restauración.
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', "[ -f /etc/crontabs/root ] && grep -q '/usr/local/bin/backup' /etc/crontabs/root"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: inventariopro-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      API_PREFIX: api
      CORS_ORIGIN: ${CORS_ORIGIN:?required}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-inventariopro}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?required}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?required}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      APP_BASE_URL: ${APP_BASE_URL:?required}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-supabase}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY}
      SUPABASE_BUCKET: ${SUPABASE_BUCKET:-inventariopro}
      MINIMAX_API_KEY: ${MINIMAX_API_KEY:?required}
      MINIMAX_API_BASE: ${MINIMAX_API_BASE:-https://api.MiniMax.com/v1}
      MINIMAX_MODEL: ${MINIMAX_MODEL:-MiniMax-M3}
      MINIMAX_TIMEOUT_MS: ${MINIMAX_TIMEOUT_MS:-10000}
      # Web Push (VAPID): sin claves el push queda deshabilitado (no rompe el deploy).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@inventariopro.example.com}
    expose:
      - '3001'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      # NEXT_PUBLIC_API_URL es build-time: Next.js la inlinea en el bundle del
      # cliente, así que debe llegar al stage de build (no solo al runtime).
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?required}
    container_name: inventariopro-frontend
    restart: always
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:?required}
    ports:
      - '3000:3000'
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://localhost:3000/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Reverse proxy con HTTPS automático vía Let's Encrypt
  caddy:
    image: caddy:2-alpine
    container_name: inventariopro-caddy
    restart: always
    # El Caddyfile usa {$FRONTEND_DOMAIN} / {$API_DOMAIN}: deben llegar como
    # variables de entorno al contenedor de Caddy, si no usa los defaults
    # inventariopro.example.com y no sirve los dominios reales.
    environment:
      FRONTEND_DOMAIN: ${FRONTEND_DOMAIN:-inventariopro.example.com}
      API_DOMAIN: ${API_DOMAIN:-api.inventariopro.example.com}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
